[package]
name = "post-ui"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
authors = ["Eduard Moldovan"]
description = "Post's window: accounts, inbox and message detail, over the headless mail library"

[dependencies]
eframe = "0.33.3"
omarchy-kit = { git = "https://github.com/edimoldovan/omarchy-kit.git", rev = "57c1c54ffff8c1c721ee094a91fb9e16a70ed2ec" }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"
post = { path = "../post" }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
rfd = "0.17.2"
# The HTML body, drawn by Blitz: system fonts and floats, nothing else — no
# SVG, no web fonts, no accessibility tree, no network stack of its own.
blitz-dom = { version = "=0.3.0-beta.3", default-features = false, features = ["system-fonts", "floats"] }
blitz-html = { version = "=0.3.0-beta.3", default-features = false }
blitz-paint = { version = "=0.3.0-beta.3", default-features = false }
blitz-traits = "=0.3.0-beta.3"
anyrender = "0.14.0"
anyrender_vello_cpu = { version = "0.18.0", default-features = false }
peniko = "0.6"
# Blitz decodes none of these on its own; mail's pictures are these four.
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
data-url = "0.3"
ureq = "2.12.1"
