[package]
name = "post-app"
version = "0.1.0"
edition = "2024"
authors = ["Eduard Moldovan"]
description = "Post's roles: the window, the terminal verbs, the MCP server and the confirmation dialog"

[[bin]]
name = "post"
path = "src/main.rs"

[dependencies]
eframe = "0.33.3"
omarchy-kit = { git = "https://github.com/edimoldovan/omarchy-kit.git", rev = "8857ca1d1fc72f56f06ea10d4b7afe14c6991c86" }
post = { path = "../post" }
post-ui = { path = "../post-ui" }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
toml = "1.1.4"
